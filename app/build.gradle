plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixcasete.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mixcasete.app"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    // Asegurar keystore debug si existe base64 o usar fallback estándar
    File customKeystore = file("${rootDir}/debug.keystore")
    if (!customKeystore.exists()) {
        File b64Keystore = file("${rootDir}/debug.keystore.base64")
        if (b64Keystore.exists()) {
            try {
                byte[] decoded = java.util.Base64.getDecoder().decode(b64Keystore.text.replaceAll("\\s+", ""))
                customKeystore.withOutputStream { it.write(decoded) }
            } catch (Exception ignored) {}
        }
    }

    signingConfigs {
        debugConfig {
            if (customKeystore.exists()) {
                storeFile customKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            if (customKeystore.exists()) {
                signingConfig signingConfigs.debugConfig
            } else {
                signingConfig signingConfigs.debug
            }
        }
        release {
            debuggable false
            minifyEnabled false
            if (customKeystore.exists()) {
                signingConfig signingConfigs.debugConfig
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += 'META-INF/DEPENDENCIES'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.24.6'
}

